name: ML Pipeline CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install scikit-learn pandas numpy matplotlib seaborn joblib fastapi uvicorn pydantic pytest httpx

      - name: Train model
        run: python src/train.py

      - name: Run data & ML tests only
        run: pytest tests/ -v -k "TestDataGeneration or TestFeatureEngineering or TestPreprocessor"
